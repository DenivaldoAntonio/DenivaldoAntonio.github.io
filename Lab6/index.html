<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coleção de Cromos</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Coleção de Cromos</h1>
    </header>

    <main>
      <section id="colecao">
        <h2>A minha coleção</h2>
        <ul id="lista"></ul>
        <h3>Total de cromos: <span id="total">0</span></h3>
      </section>

      <section>
        <h2>Registar novo cromo</h2>
        <form>
          <input type="number" placeholder="Número" min="1" required />
          <input type="submit" value="Registar Cromo" />
        </form>
      </section>

      <section id="repetidos">
        <h2>Cromos repetidos</h2>
        <ul id="listaRepetidos"></ul>
        <h3>Total de repetidos: <span id="totalRepetidos">0</span></h3>
      </section>
    </main>

    <footer>
      <p>2026, ULusófona</p>
    </footer>
  </body>
</html>
