<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 4</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="scripts/main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Lab 5</h1>
    </header>

    <main>
      <section>
        <h2 id="ex1">1. Passa por aqui!</h2>
      </section>

      <section>
        <h2 id="ex2">2. Pinta-me</h2>

        <button data-cor="red">Red</button>
        <button data-cor="green">Green</button>
        <button data-cor="blue">Blue</button>
      </section>

      <section>
        <h2>3. Experimenta escrever...</h2>
        <input type="text" id="texto" />
      </section>

      <section>
        <h2>4. Escolha uma cor:</h2>

        <select id="escolher-cor">
          <option value="white">White</option>
          <option value="red">Red</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
          <option value="yellow">Yellow</option>
        </select>
      </section>

      <section>
        <h2>
          5.
          <button id="contar">Conta!</button>
          <span id="contador">33</span>
        </h2>
      </section>

      <section>
        <h2>6.</h2>

        <form id="form-pessoa">
          <input type="text" id="nome" placeholder="Nome" required />
          <input
            type="number"
            id="idade"
            placeholder="Idade"
            min="0"
            required
          />
          <button type="submit">Submit</button>
        </form>

        <p id="mensagem"></p>
      </section>

      <section>
        <h2>7. Automatic Counter: <span id="automatico">0</span></h2>
      </section>
    </main>

    <footer>
      <img
        src="../images/diw.svg"
        alt="Desenvolvimento de Interfaces Web"
        width="80"
      />
      <p>Desenvolvimento de Interfaces Web</p>
    </footer>
  </body>
</html>
